<style>

  --accent:#8f89ff;--accent-bg:#1d1f4d;--ok:#5fe0b0;--ok-bg:#0b3a2b;--warn:#ffc86b;--warn-bg:#3d2a07;
  --bad:#ff9b9f;--bad-bg:#47131a;--info:#9db4ff;--info-bg:#17255e;--mute:#c4c8e4;--mute-bg:#262b4d;--code:#1a1e3b;--shadow:0 10px 30px -14px rgba(0,0,0,.7)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:.84em}
code{background:var(--code);padding:1px 6px;border-radius:6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
/* top bar */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding:10px 20px}
header.top h1{font:700 17px/1 var(--display);margin:0;letter-spacing:-.01em;white-space:nowrap;display:flex;gap:9px;align-items:center}
header.top h1 i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#a855f7);display:inline-block;position:relative}
header.top h1 i::after{content:"";position:absolute;inset:6px;border:2px solid #fff;border-radius:50%;border-right-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.chip{font:500 11.5px var(--mono);padding:3px 10px;border-radius:99px;background:var(--surface);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}.chip.ok b{color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}.chip.warn b{color:var(--warn)}
input[type=search]{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:190px;font:inherit;font-size:14px}
button,.btn{font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:10px;transition:background .15s,border-color .15s}
button:hover{background:var(--surface2)}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* layout */
.layout{display:flex;max-width:1440px;margin:0 auto}
nav.side{width:236px;flex:none;position:sticky;top:57px;align-self:flex-start;height:calc(100vh - 57px);overflow:auto;padding:22px 12px 30px 20px}
nav.side a{display:flex;gap:11px;align-items:center;padding:9px 11px;border-radius:12px;color:var(--ink2);text-decoration:none;font-size:14px;font-weight:500;margin-bottom:2px}
nav.side a:hover{background:var(--surface);color:var(--ink)}
nav.side a.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
nav.side a.active .n{background:var(--accent);color:#fff}
nav.side .n{width:24px;height:24px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font:600 11px var(--mono);flex:none}
nav.side .sep{font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--ink2);margin:20px 11px 8px}
main{flex:1;min-width:0;padding:22px 28px 90px}
section.doc{display:none}
section.doc.show{display:block;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* type */
h2{font:700 clamp(30px,4vw,44px)/1.05 var(--display);letter-spacing:-.025em;margin:10px 0 10px}
.eyebrow{display:block;font:600 11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
h3{font:650 21px/1.2 var(--display);letter-spacing:-.015em;margin:44px 0 12px;display:flex;align-items:center;gap:10px}
h3::after{content:"";height:1px;background:var(--line);flex:1}
h4{font:600 11.5px var(--mono);margin:16px 0 6px;color:var(--ink2);text-transform:uppercase;letter-spacing:.1em}
p.lead{color:var(--ink2);margin:0 0 20px;max-width:72ch;font-size:16.5px}
/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.card>h4:first-child{margin-top:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.stat{padding:16px 18px}.stat .v{font:700 34px/1 var(--display);letter-spacing:-.03em}.stat .l{font-size:12.5px;color:var(--ink2);margin-top:6px}
.badge{display:inline-block;font:600 11px var(--mono);padding:2px 9px;border-radius:99px;white-space:nowrap;letter-spacing:.01em}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)}.b-info{background:var(--info-bg);color:var(--info)}.b-mute{background:var(--mute-bg);color:var(--mute)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
th{font:600 11px var(--mono);color:var(--ink2);text-transform:uppercase;letter-spacing:.1em;background:var(--surface2)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 16px;align-items:center}
.filters button{font-size:13px;padding:5px 13px;border-radius:99px}
details{border:1px solid var(--line);border-left-width:4px;border-radius:14px;background:var(--surface);margin:9px 0;transition:box-shadow .15s}
details[open]{box-shadow:var(--shadow)}
details>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+";font:600 16px var(--mono);color:var(--ink2);width:16px}
details[open]>summary::before{content:"–"}
details>.body{padding:2px 18px 16px 41px}
details[data-st=open]{border-left-color:var(--bad)}details[data-st=fixed]{border-left-color:var(--ok)}
details[data-st=wip],details[data-st=unver]{border-left-color:var(--amber)}
#tlist details,details:not([data-st]){border-left-color:var(--accent)}
ul.tight{margin:4px 0;padding-left:20px}ul.tight li{margin:4px 0}
.note{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface);padding:12px 16px;border-radius:12px;margin:14px 0;font-size:14.5px}
.note.warn{border-left-color:var(--amber);background:var(--warn-bg);color:var(--ink)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.node{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;cursor:pointer;text-align:left;width:100%}
.node:hover{border-color:var(--accent)}
.node.sel{border-color:var(--accent);background:var(--accent-bg);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.node .t{font:650 15px var(--display)}.node .s{font-size:12.5px;color:var(--ink2)}
.arrow{text-align:center;color:var(--ink2);line-height:1;padding:3px;font-family:var(--mono)}
.phases{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin-bottom:6px}
.phases button{white-space:nowrap;border-radius:99px}
.step{display:grid;grid-template-columns:84px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.actor{font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:8px;height:fit-content;text-align:center}
.a-User{background:var(--info-bg);color:var(--info)}.a-App{background:var(--accent-bg);color:var(--accent)}
.a-Service{background:var(--ok-bg);color:var(--ok)}.a-Server{background:var(--warn-bg);color:var(--warn)}.a-Partner,.a-OS{background:var(--mute-bg);color:var(--mute)}
.phone{width:240px;border:7px solid var(--ink);border-radius:34px;padding:10px;background:var(--bg);margin:auto}
.phone .scr{background:var(--surface);border-radius:22px;padding:12px 9px;min-height:360px;font-size:11.5px}
.phone .el{border:1px solid var(--line);border-radius:9px;padding:5px 8px;margin:5px 0;background:var(--surface2)}
.swatch{display:flex;gap:12px;align-items:center;padding:6px 0}.swatch i{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);flex:none}
.tree{font-size:13.5px}
.tree .dir{font:600 11px var(--mono);margin:14px 0 4px;color:var(--ink2);text-transform:uppercase;letter-spacing:.08em}
.file{display:flex;gap:8px;justify-content:space-between;padding:4px 9px;border-radius:8px;cursor:pointer}
.file:hover{background:var(--surface2)}.file.sel{background:var(--accent-bg);color:var(--accent);font-weight:600}
.file span:last-child{color:var(--ink2);font:12px var(--mono);flex:none}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent)}
.sim{display:grid;gap:12px}
select{font:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
pre.mono{font:13px/1.6 var(--mono)}
footer{color:var(--ink2);font-size:12.5px;margin-top:56px;border-top:1px solid var(--line);padding-top:14px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:34px 34px 26px;color:#eceeff;margin-bottom:8px;
  background:radial-gradient(1200px 400px at 85% -10%,rgba(143,137,255,.45),transparent 60%),linear-gradient(160deg,#171a45 0%,#0b0d24 70%);}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(180deg,#000,transparent 85%)}
.hero>*{position:relative}
.hero .eyebrow{color:#a9a5ff}
.hero h2{color:#fff;font-size:clamp(34px,5.4vw,60px);margin:0 0 10px;max-width:15ch}
.hero p{color:#b9bde0;max-width:62ch;margin:0 0 22px;font-size:16.5px}
.pipe{display:flex;align-items:stretch;gap:0;margin:6px 0 24px;position:relative;overflow-x:auto;padding-bottom:4px}
.pipe .st{flex:1;min-width:120px;padding:12px 14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);border-radius:14px;position:relative;margin-right:26px}
.pipe .st:last-child{margin-right:0}
.pipe .st::after{content:"";position:absolute;right:-26px;top:50%;width:26px;height:2px;background:linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,255,255,.1))}
.pipe .st:last-child::after{display:none}
.pipe .st b{display:block;font:650 15px var(--display);color:#fff}
.pipe .st span{display:block;font:11.5px var(--mono);color:#9da3d6;margin-top:3px}
.pipe .st.hot{border-color:#a9a5ff;background:rgba(143,137,255,.16)}
.pulse{position:absolute;left:0;top:calc(50% - 4px);width:10px;height:10px;border-radius:50%;background:#ffb43a;box-shadow:0 0 14px 3px rgba(255,180,58,.7);animation:run 4.8s linear infinite}
@keyframes run{0%{left:2%;opacity:0}8%{opacity:1}92%{opacity:1}100%{left:98%;opacity:0}}
.heros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.heros>div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px 16px}
.heros .v{font:700 30px/1 var(--display);letter-spacing:-.03em;color:#fff}
.heros .l{font:11.5px var(--mono);color:#9da3d6;margin-top:6px}
.heros .v small{font:600 11px var(--mono);color:#6ee7b7;margin-left:4px}
.heros .v small.bad{color:#ff9b9f}
/* feature tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;cursor:pointer;display:block;width:100%;position:relative;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--accent)}
.tile::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--c,var(--line))}
.tile[data-ev=device]{--c:var(--ok)}.tile[data-ev=unit]{--c:var(--info)}.tile[data-ev=partial],.tile[data-ev=wip],.tile[data-ev=spec]{--c:var(--amber)}.tile[data-ev=open]{--c:var(--bad)}
.tile .nm{font:650 15.5px/1.25 var(--display);margin-bottom:8px;display:block;padding-left:4px}
.tile .meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding-left:4px}
.tile .x{display:none;margin-top:12px;font-size:13.5px;color:var(--ink);border-top:1px dashed var(--line);padding-top:10px;cursor:default}
.tile.openx{grid-column:1/-1}.tile.openx .x{display:block}
.tgroup{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin:22px 0 10px}
@media(max-width:760px){
  nav.side{position:fixed;left:0;top:57px;z-index:15;background:var(--surface);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .2s;width:250px}
  nav.side.open{transform:none}
  main{padding:16px 16px 80px}
  #menu{display:inline-block!important}
  .chips{display:none}
  .hero{padding:24px 20px 20px;border-radius:20px}
}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;left:50%}section.doc.show{animation:none}html{scroll-behavior:auto}}
#menu{display:none}
</style>

function renderTopChips(){
  if(!hasLive){ $('#topchips').innerHTML = '<span class="chip warn"><b>No live data</b> run refresh-live-docs.py</span>'; return; }
  const {u,g} = liveStats();
  const bad = (u.failed||0)>0;
  $('#topchips').innerHTML =
   `<span class="chip"><b>v${esc(LIVE.app.versionName)}</b> (${esc(LIVE.app.versionCode)})</span>`+
   `<span class="chip ${bad?'warn':'ok'}"><b>${u.ran}</b> unit tests · ${u.failed} failed · ${u.skipped} skipped</span>`+
   `<span class="chip"><b>${esc(g.branch)}</b> @ ${esc((g.head||'').split(' ')[0])}</span>`+
   (g.dirty&&g.dirty.length?`<span class="chip warn"><b>${g.dirty.length}</b> uncommitted file${g.dirty.length>1?'s':''}</span>`:'')+
   `<span class="chip">data ${esc(LIVE.generated)}</span>`;
}

function renderNav(){
  $('#nav').innerHTML = SECTIONS.map(([id,n,t],i)=>
    (i===1?'<div class="sep">Documents</div>':'')+(i===7?'<div class="sep">For developers</div>':'')+
    `<a href="#${id}" data-id="${id}"><span class="n">${n}</span>${t}</a>`).join('');
}

function show(id){
  if(!SECTIONS.find(s=>s[0]===id)) id='overview';
  current=id;
  $$('section.doc').forEach(s=>s.classList.toggle('show',s.id===id));
  $$('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.id===id));
  $('#nav').classList.remove('open');
  window.scrollTo({top:0});
  history.replaceState(null,'','#'+id);
}

   <div class="card"><h4>Problem</h4><p style="margin:0">Willpower fails at the weak moment. Filters that can be switched off in two taps do not help. People need friction that sits between the urge and the off switch, on the phone they already use, without factory-reset enrolment.</p></div>

   <div class="card"><h4>Success looks like</h4><ul class="tight"><li>Protection stays on and the user can see whether it is.</li><li>A bypass attempt meets a challenge proportional to what it removes.</li><li>No false claims of protection when the engine is degraded or stopped.</li></ul><p style="margin:6px 0 0;color:var(--ink2)">No numeric product metrics are recorded in the repository.</p></div>
  </div>
  <h3>Goals, non-goals, anti-goals</h3>
  <div class="grid g3">
   <div class="card"><h4>Goals</h4><ul class="tight"><li>Block adult sites across readable browsers, including evasions.</li><li>Block specific distraction surfaces in native apps (Reels, Shorts, Explore search, Channels).</li><li>Gate every action that weakens protection.</li><li>Work offline, with no account.</li><li>Optional cloud backup and a second device.</li></ul></div>
   <div class="card"><h4>Non-goals</h4><ul class="tight"><li>Device Owner / MDM lockdown (needs a fresh device).</li><li>A VPN or DNS filter as the main mechanism (one VPN slot, no path/query, no custom block screen). Recommended later as a second layer.</li><li>Root, Xposed, browser extensions.</li><li>Payments (no Play Billing; the free AI Coach has a daily cap instead).</li></ul></div>
   <div class="card"><h4>Anti-goals</h4><ul class="tight"><li>Overclaiming protection (POLICY_RULES #15): a green tick the app cannot verify.</li><li>A block that traps the user with no exit (audit #21).</li><li>False positives on banks, recovery sites, health and education.</li><li>Silent failure: protection down with nothing in the UI.</li></ul></div>
  </div>
  <h3>Feature requirements and live status</h3>
  ${featureTable(true)}
  <h3>Accountability: how hard is each action to undo?</h3>
  <p class="lead">Interactive: pick an action and a partner mode to see the friction the code applies.</p>
  ${simulator()}
  <h3>Requirements the app must keep (from the audits)</h3>
  <div class="grid g2">
   <div class="card"><ul class="tight">
    <li><b>R1</b> Every weakening action routes through <code>requestAccountabilityChallenge</code> and the dialog watches the shared ViewModel (POLICY_RULES #20).</li>
    <li><b>R2</b> The manual blocklist is 24/7; Focus Mode only adds to it.</li>
    <li><b>R3</b> Never cache a verdict made while the blocklist is still loading.</li>
    <li><b>R4</b> A cloud update never weakens a device that has a partner.</li>
    <li><b>R5</b> Release builds never log queries, hosts or settings.</li></ul></div>
   <div class="card"><ul class="tight">
    <li><b>R6</b> Rejection by the AI is final: no Time Delay offer after "rejected", only after "could not answer".</li>
    <li><b>R7</b> An unknown partner mode gets the 24-hour delay, not a free pass.</li>
    <li><b>R8</b> Protection status must say stopped / degraded when true.</li>
    <li><b>R9</b> Sign Out, Factory Reset, Uninstall and Delete Account live only in Settings, on purpose.</li>
    <li><b>R10</b> Detection changes must be proven to reach the decision (PolicyPropagationIntegrationTest).</li></ul></div>
  </div>
  <h3>Open product decisions</h3>
  <ul class="tight"><li>Customize Blocked Screen: wire it up or remove it (F16).</li><li>Portrait lock excludes about 26 tablet / TV / car device types (F9-b).</li><li>Remove unused biometric permissions pulled in by a library (F22).</li><li>Add a VPN host layer as a second line (audit #9)?</li><li>Official-apps-only backend: approved design, not built.</li></ul>`;
}

function simulator(){
  const acts = [
   ['Disable Adult Content Blocker','STRICT'],['Disable Known Piracy Sites Blocker','STRICT'],['Disable Unsupported Browser Blocker','STRICT'],
   ['Disable Uninstall Protection','STRICT'],['Factory Reset Blockerflow','STRICT'],['Uninstall Blockerflow','STRICT'],['Delete Account','STRICT'],
   ['Disable Image/Video Search Blocker','MODERATE'],['Add Website to Whitelist','MODERATE'],['Remove Website from Blocklist','MODERATE'],['Unblock App','MODERATE'],['Disable Focus Mode','MODERATE'],['Disable New App Blocker','MODERATE'],['Disable X.com / Twitter Videos Blocker','MODERATE'],
   ['Disable Facebook Reels Blocker','LENIENT'],['Disable Instagram Reels Blocker','LENIENT'],['Disable Youtube Shorts Blocker','LENIENT'],['Disable Snapchat Videos Blocker','LENIENT']];
  return `<div class="card sim"><div style="display:flex;gap:10px;flex-wrap:wrap">
   <label>Action<br><select id="simAct">${acts.map(a=>`<option value="${a[1]}">${esc(a[0])}</option>`).join('')}</select></label>
   <label>Partner mode<br><select id="simMode"><option value="myself">Myself</option><option value="friend">Friend</option><option value="timedelay">Time Delay</option><option value="ai">AI Coach</option><option value="x">Unknown / corrupted value</option></select></label></div>
   <div id="simOut"></div></div>`;
}
function runSim(){
  const w=$('#simAct'); if(!w) return; const weight=w.value, mode=$('#simMode').value;
  const wb = {STRICT:'b-bad',MODERATE:'b-warn',LENIENT:'b-ok'}[weight];
  let t='';
  if(mode==='myself') t='Type a fixed sentence. Passes at <b>95% accuracy</b> (Levenshtein; an imperfect attempt is never rounded up to 100). Local only, no network.';
  if(mode==='friend') t='Partner gets an email via Amazon SES with <b>Approve / Deny</b> buttons and a 6-digit PIN. The app unlocks within about a second of Approve, or the PIN is typed. Link and PIN live <b>24 hours</b>; <b>5</b> wrong PINs kill the challenge; max <b>20</b> emails per day; needs sign-in.';
  if(mode==='timedelay') t='Start a <b>24-hour</b> timer for this action. Countdown on screen; the action unlocks when it ends. Uses a trusted clock, so changing the date does not skip it (a date change plus reboot still does).';
  if(mode==='ai') t='Server checks sign-in and a fixed list of action names, then a <b>deterministic forbidden-justification filter</b>, then Gemini. '+(weight==='STRICT'?'<b>STRICT: the AI is never trusted alone</b>; a rejection is delayed 5 s.':weight==='MODERATE'?'A specific, plausible reason can pass; a rejection is delayed 2 s.':'Easy to pass; no extra delay.')+' Limit <b>10 checks per day</b> per user and 3,000 project-wide. If the AI cannot answer, the dialog offers the 24-hour delay; if it rejects, it does not.';
  if(mode==='x') t='Unknown value → treated as <b>Time Delay (24 hours)</b>, never a free pass (PartnerModes.challengeFor).';
  $('#simOut').innerHTML = `<div><span class="badge ${wb}">${weight}</span> ${weight==='STRICT'?'Core protection or the app\'s own survival: should be hard.':weight==='MODERATE'?'Real commitment; a specific reason can hold.':'Single-platform distraction feature: friction is about intent.'}</div><div class="note">${t}</div>`;
}

  <h3>AI logic step by step</h3>

   <li>Why SES: Gmail SMTP capped near 500 sends a day. SES production access allows 50,000 per 24 h at 14 per second. Switched 2026-09-06.</li>
   <li>Region eu-central-1 (Frankfurt). Identities: domain <code>khaleel.eu</code> and the sender address. If the identity moves region, <code>SES_SMTP_HOST</code> must move.</li>
   <li>The email is a <b>fixed template</b>: only the server-made PIN, a validated action and the requester's first name (HTML-escaped, max 40 chars) are inserted. A signed-in user cannot use it as a relay for free text.</li>
   <li>PIN: 6 digits, server generated, stored as salted hash; 24 h expiry; 5 attempts; deleted on first success. Approval link: 32 random bytes, only its SHA-256 is stored; a GET shows a page, only a POST decides (mail scanners cannot approve).</li>
   <li>Cap: 20 emails per user per day.</li></ul>
  <h3>Firestore collections and rules</h3>
  <div class="tablewrap"><table><thead><tr><th>Path</th><th>Client access</th><th>Holds</th></tr></thead><tbody>${COLLECTIONS.map(r=>`<tr><td><code>${esc(r[0])}</code></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>
  <h3>Where user data lives, and why</h3>
  <div class="grid g2">
   <div class="card"><h4>On the phone only</h4><ul class="tight"><li>Every setting (DataStore) so the service can read it without a network.</li><li>Live focus state, onboarding and acknowledgement flags, sync bookkeeping.</li><li>What you browse: never stored or sent. URLs are judged in memory.</li></ul></div>
   <div class="card"><h4>In the cloud, only after sign-in</h4><ul class="tight"><li>Allowlisted settings in <code>users/{uid}</code> (restore after reinstall, second device).</li><li>Short-lived challenge data (hashes, expiry) and daily counters.</li><li>The partner's email address is sent to the function to deliver the message; it is saved on-device as <code>partner_email</code> and synced as a setting.</li></ul></div>
  </div>
  <h3>Secrets and keys (names only, no values)</h3>
  <div class="tablewrap"><table><thead><tr><th>Name</th><th>Stored in</th><th>Note</th></tr></thead><tbody>${SECRETS.map(r=>`<tr><td><code>${esc(r[0])}</code></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>
  <h3>Planned: only official apps may use the backend</h3>
  <div class="note warn">${badge('spec')} Approved 2026-10-14 for when the repository goes public: Play Integrity App Check on Android, an <code>X-Blockerflow-Client</code> header on every call, and a <code>config/clientPolicy</code> document (record or enforce, block lists) read by a new <code>lib/clientPolicy.js</code>. Not implemented; searched android/ and backend/ today. Owner steps in Play Console and Firebase are still needed.</div>
  <h3>Backend operations</h3>
  <ul class="tight"><li><b>Runtime deadline:</b> Node 20 stops running on 2026-10-30 (12 days from this snapshot). Upgrade not started.</li><li><code>evaluateExcusePro</code> keeps one warm instance (small continuous cost, deliberate).</li><li>Tests: <code>npm test</code> (${be.result?be.result.pass+' pass, '+be.result.fail+' fail':(be.declared||'?')+' declared'}); Firestore rules test needs the emulator (<code>npm run test:rules</code>).</li></ul>`;
}

/* ---------- Problems ---------- */
function secProblems(){
  const counts = k => PROBLEMS.filter(p=>p.st===k).length;
  const areas = [...new Set(PROBLEMS.map(p=>p.area))].sort();
  return `
  <h2>6 · Problems & Fixes so far</h2>
  <p class="lead">${PROBLEMS.length} entries grouped from the security audit (26 findings), the changelog, the QA manual, and today's own checks. "Fix not verified" means the code changed but no phone test is recorded.</p>
  <div class="grid g4">
   <div class="card stat"><div class="v">${counts('open')}</div><div class="l">open</div></div>
   <div class="card stat"><div class="v">${counts('wip')+counts('unver')}</div><div class="l">in progress or not verified</div></div>
   <div class="card stat"><div class="v">${counts('fixed')}</div><div class="l">fixed</div></div>
   <div class="card stat"><div class="v">${PROBLEMS.filter(p=>p.sev==='Critical').length}</div><div class="l">critical ever found</div></div>
  </div>
  <div class="filters" id="pf">${[['all','All'],['open','Open'],['wip','In progress'],['unver','Not verified'],['fixed','Fixed']].map(([k,t])=>`<button data-f="${k}" class="${k==='all'?'on':''}">${t}</button>`).join('')}
   <select id="pa"><option value="">All areas</option>${areas.map(a=>`<option>${esc(a)}</option>`).join('')}</select></div>
  <div id="plist">${PROBLEMS.map(p=>`
   <details data-st="${p.st}" data-area="${esc(p.area)}"><summary><span class="badge ${p.st==='fixed'?'b-ok':p.st==='open'?'b-bad':'b-warn'}">${EV[p.st].t}</span><span class="badge b-mute">${esc(p.sev)}</span><span style="font-weight:600">${esc(p.title)}</span></summary>
   <div class="body"><p style="margin:0 0 6px;color:var(--ink2)">${esc(p.id)} · ${esc(p.area)} · ${esc(p.date)}</p>
    <h4>What happened</h4><p style="margin:0">${esc(p.symptom)}</p>
    <h4>Cause</h4><p style="margin:0">${esc(p.cause)}</p>
    <h4>Fix</h4><p style="margin:0">${esc(p.fix)}</p>
    <h4>Evidence</h4><p style="margin:0">${esc(p.proof)}</p>
    <p style="margin:8px 0 0;font-size:12.5px;color:var(--ink2)">Source: ${esc(p.ref)}</p></div></details>`).join('')}</div>
  <h3>Patterns worth remembering</h3>
  <ul class="tight">
   <li><b>Wired but dead.</b> Code compiled, tests passed, nothing ran at runtime (ProtectionReminderWorker never scheduled; BlocklistScreen with its own ViewModel). Only exercising the flow on a phone, or grepping call sites, finds these.</li>
   <li><b>Phone makers differ.</b> Most real-world failures were Xiaomi-specific (pop-ups, RAM cleaner, Autostart).</li>
   <li><b>Convenience beats protection.</b> The biggest bypasses needed no skill: whitelist add, a browser toggle, a sob story to the AI.</li>
   <li><b>Commit early.</b> A reset wiped a month of uncommitted work (2026-08-15).</li></ul>`;
}

/* ---------- Code map ---------- */
function secCode(){
  const files = (LIVE.files||[]);
  const total = files.reduce((a,f)=>a+f.lines,0);
  const dirs = {};
  files.forEach(f=>{ const d = f.path.includes('/')?f.path.split('/').slice(0,-1).join('/'):'(root)'; (dirs[d]=dirs[d]||[]).push(f); });
  const order = ['(root)','services','data','detector','ui','ui/components','setup','receivers','theme','debug'];
  const names = Object.keys(dirs).sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b)});
  return `
  <h2>7 · Code Map: understand the app from the code</h2>
  <p class="lead">${files.length} Kotlin files, ${fmt(total)} lines under <code>android/app/src/main/java/eu/khaleel/blockerflow</code> (measured). Click a file for its role, its key functions and its tests.</p>
  <h3>Read it in this order</h3>
  <ol class="tight">${READING_ORDER.map(r=>`<li><code>${esc(r[0])}</code>: ${esc(r[1])}</li>`).join('')}</ol>
  <h3>Files</h3>
  <div class="split">
   <div class="card tree" style="max-height:640px;overflow:auto"><input type="search" id="cq" placeholder="Filter files…" style="width:100%;margin-bottom:8px">
   ${names.map(d=>`<div class="dir">${esc(d)}/</div>`+dirs[d].sort((a,b)=>b.lines-a.lines).map(f=>`<div class="file" data-path="${esc(f.path)}"><span>${esc(f.path.split('/').pop())}</span><span>${f.lines}${CODE[f.path]?'':' ·'}</span></div>`).join('')).join('')}
   </div>
   <div class="card" id="codeBox" style="position:sticky;top:70px;align-self:flex-start"></div>
  </div>
  <h3>Glossary</h3>
  <div class="tablewrap"><table><tbody>${GLOSSARY.map(g=>`<tr><td style="width:190px"><b>${esc(g[0])}</b></td><td>${esc(g[1])}</td></tr>`).join('')}</tbody></table></div>
  <h3>How to add a blocker (the repo's own checklist)</h3>
  <ol class="tight"><li>Add an <code>OptionRow</code> in MainScreen.kt.</li><li>Add the preference in ConfigManager, expose it in MainViewModel, add it to AppConfigSnapshot.</li><li>Wire the flag in PolicyEngine or NativeContentDetector.</li><li>Add tests, including one proving the detection reaches the decision (PolicyPropagationIntegrationTest).</li><li>If it can weaken protection: wrap the off-transition in <code>requestAccountabilityChallenge</code> and pass the <b>shared</b> MainViewModel to any new screen.</li></ol>`;
}
function renderCode(path){
  const f = (LIVE.files||[]).find(x=>x.path===path); if(!f) return;
  const d = CODE[path];
  const base = path.split('/').pop().replace('.kt','');
  const tests = [...(LIVE.unitTests?.classes||[]),...(LIVE.deviceTests?.classes||[])].filter(c=>c.cls===base+'Test'||c.cls.startsWith(base)||(base==='AppBlockerService'&&/Device/.test(c.cls)));
  const lines = f.lines;
  $('#codeBox').innerHTML = `<h4>${esc(path)}</h4><div class="bar" title="${lines} lines"><i style="width:${Math.min(100,lines/13)}%"></i></div><p style="margin:4px 0 8px;font-size:12.5px;color:var(--ink2)">${lines} lines${d&&d[2]?' · '+esc(d[2]):''}</p>
   <p style="margin:0 0 8px">${d?esc(d[0]):'Not described by hand yet. Open the file; the doc comment at the top of most files explains why it exists.'}</p>
   ${d&&d[1]?`<h4>Key names</h4><p style="margin:0"><code>${esc(d[1])}</code></p>`:''}
   <h4>Tests</h4>${tests.length?`<ul class="tight">${tests.map(t=>`<li><code>${esc(t.cls)}</code> · ${t.names.length} tests</li>`).join('')}</ul>`:'<p style="margin:0;color:var(--ink2)">No test class named after this file (it may be covered through an integration test).</p>'}`;
}

/* global search: jumps to the first section that contains the text and highlights nothing else */
function globalSearch(q){
  q=q.trim().toLowerCase(); if(q.length<2) return;
  const order=[current,...SECTIONS.map(s=>s[0]).filter(i=>i!==current)];
  const hit=order.find(id=>$('#'+id).textContent.toLowerCase().includes(q));
  if(!hit) return;
  if(hit!==current) show(hit);
  const sec=$('#'+hit); const w=document.createTreeWalker(sec,NodeFilter.SHOW_TEXT);
  let n; while((n=w.nextNode())){ if(n.nodeValue.toLowerCase().includes(q)){ let el=n.parentElement; const det=el.closest('details'); if(det) det.open=true; const tr=el.closest('tr.detail'); if(tr) tr.hidden=false; el.scrollIntoView({block:'center'}); break; } }
}

  mount();
  $('#nav').addEventListener('click',e=>{const a=e.target.closest('a');if(a){e.preventDefault();show(a.dataset.id)}});
  window.addEventListener('hashchange',()=>show((location.hash||'#overview').slice(1)));
  $('#menu').addEventListener('click',()=>$('#nav').classList.toggle('open'));
  $('#q').addEventListener('keydown',e=>{if(e.key==='Enter')globalSearch(e.target.value)});
  document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
  const root=document.documentElement;
  try{const t=localStorage.getItem('bf-theme');if(t)root.dataset.theme=t}catch(e){}
  $('#theme').addEventListener('click',()=>{const dark=(root.dataset.theme==='dark')||(!root.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);const nt=dark?'light':'dark';root.dataset.theme=nt;try{localStorage.setItem('bf-theme',nt)}catch(e){}});
});
